name: Release agent packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["version"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" \
            dist/life-coach-codex-plugin.zip \
            dist/career-coach-codex.zip \
            dist/career-coach-workbuddy-skill.zip \
            dist/career-coach-workbuddy-agent.zip \
            dist/career-coach-doubao.md \
            dist/manifest.json \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes
